name: Release

# Push an annotated tag that matches manifest.json, e.g.
#   git tag -a v1.0.1 -m "What changed"  &&  git push origin v1.0.1
# The tag's message becomes the release notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the annotated tag object carries the release notes
          # This job can write to the repository and also runs go and yarn: keep the token out of
          # .git/config, where they could read it. gh gets it from GH_TOKEN, only to publish.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: companion/go.sum
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: go test ./...
        working-directory: companion
      - name: Check the tag matches manifest.json
        run: |
          version="v$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi
      - name: Build both packages
        run: |
          yarn build:store
          mv alibi-store.zip "alibi-$GITHUB_REF_NAME-chrome-web-store.zip"
          yarn build
          (cd build && zip -qr "../alibi-$GITHUB_REF_NAME.zip" .)
      - name: Build Alibi Companion
        run: |
          yarn build:companion
          (cd companion/dist && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "alibi-$GITHUB_REF_NAME.zip#Alibi $GITHUB_REF_NAME (unzip, then Load unpacked)" \
            "alibi-$GITHUB_REF_NAME-chrome-web-store.zip#Chrome Web Store upload (no userScripts or nativeMessaging permission)" \
            "companion/dist/alibi-companion-windows-x64.exe#Alibi Companion for Windows (x64)" \
            "companion/dist/alibi-companion-windows-arm64.exe#Alibi Companion for Windows (ARM64)" \
            "companion/dist/alibi-companion-linux-x64#Alibi Companion for Linux (x64)" \
            "companion/dist/alibi-companion-linux-arm64#Alibi Companion for Linux (ARM64)" \
            "companion/dist/SHA256SUMS#SHA-256 checksums of the companion downloads" \
            --title "Alibi $GITHUB_REF_NAME" \
            --notes-from-tag \
            --verify-tag
