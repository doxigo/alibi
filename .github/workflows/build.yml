name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build:store
      - name: Check the store zip opens, with manifest.json at its root
        shell: bash
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          $py -c "import sys, zipfile; z = zipfile.ZipFile('alibi-store.zip'); sys.exit(z.testzip() is not None or 'manifest.json' not in z.namelist() or any(chr(92) in i.orig_filename for i in z.infolist()))"
      - run: yarn build
      # css/style.css is committed so a clone or GitHub's "Source code" zip loads styled.
      # Linux only: a Windows checkout turns line endings into CRLF.
      - name: Check the committed CSS is current
        if: runner.os == 'Linux'
        run: git diff --exit-code -- css/ || { echo "::error::css/style.css is stale; run yarn build:css and commit it"; exit 1; }
      # The unpacked extension, ready for "Load unpacked". GitHub wraps every download in a zip;
      # the store zip is a separate thing (yarn build:store) and isn't uploaded here.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: alibi-extension
          path: build/
          if-no-files-found: error

  check-page:
    name: Check page
    if: github.event_name != 'pull_request'
    needs: extension
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build:css
      - name: Assemble the static check page
        run: |
          mkdir -p _site/css _site/fonts
          cp test/check.html _site/index.html
          cp test/frame.html test/worker* _site/
          cp css/style.css _site/css/
          cp fonts/archivo.woff2 _site/fonts/
          cp img/mark.svg _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
