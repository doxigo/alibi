name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      # The unpacked extension, ready for "Load unpacked". GitHub wraps every download in a zip;
      # the store zip is a separate thing (yarn build:store) and isn't built here.
      - uses: actions/upload-artifact@v7
        with:
          name: alibi-extension
          path: build/
          if-no-files-found: error

  check-page:
    name: Check page
    if: github.event_name != 'pull_request'
    needs: extension
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build:css
      - name: Assemble the static check page
        run: |
          mkdir -p _site/css _site/fonts
          cp test/check.html _site/index.html
          cp test/frame.html test/worker* _site/
          cp css/style.css _site/css/
          cp fonts/archivo.woff2 _site/fonts/
          cp img/mark.svg _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
