<!DOCTYPE html>

<body style="width:1280px;height:800px">

    <h1>Two modes. You choose the trade.</h1>
    <p class="lede">Stealth rewrites what each page reads, with no banner. Deep works below the page, and Chrome says so.</p>
    <ul class="points"><li>Stealth: quiet, the default</li><li>Deep: covers iframes and workers too</li><li>Light and dark, like your browser</li></ul>

  <div style="position:relative">

  </defs>

    <circle cx="70" cy="70" r="64" fill="none" stroke-width="2.6" /><circle cx="70" cy="70" r="44" fill="none" stroke-width="1.4" />

    <text stroke="none" font-weight="600" letter-spacing="1.3" style="font-stretch:72%"><textPath href="#b520" startOffset="50%" text-anchor="middle" font-size="9.5">JAPAN · JP</textPath></text>
    <text stroke="none" x="70" y="58" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.9" style="font-stretch:75%">18 OCT 26</text>
    <text stroke="none" x="70" y="84" text-anchor="middle" font-size="25" font-weight="700" style="font-stretch:80%">19:42</text>
  </g>
</svg>
    <img class="popup" src="popup-deep-dark.png" alt="" style="position:relative">
